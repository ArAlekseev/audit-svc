global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: audit-svc
    metrics_path: /metrics
    static_configs:
      - targets: ['audit-nginx:8088']

  - job_name: nginx
    static_configs:
      - targets: ['audit-nginx-exporter:9113']
