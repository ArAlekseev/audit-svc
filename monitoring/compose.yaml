services:
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - audit-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - audit-network
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:

networks:
  audit-network:
    external: true
